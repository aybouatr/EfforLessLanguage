services:
  auth-api:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: auth-service-dev

    ports:
      - "8080:8080"

    volumes:
      - .:/src
      - nuget_cache:/root/.nuget/packages

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

volumes:
  nuget_cache: